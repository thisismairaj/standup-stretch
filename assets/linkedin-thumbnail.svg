<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- eyebrow label -->
  <text x="80" y="76" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="600" letter-spacing="2" fill="#2ea043">OPEN SOURCE · CLAUDE CODE PLUGIN + CLI</text>

  <!-- terminal card -->
  <g transform="translate(80, 104)">
    <rect width="1040" height="130" rx="10" fill="#1c2128" stroke="#30363d" stroke-width="1"/>
    <!-- traffic lights -->
    <circle cx="28" cy="28" r="6" fill="#ff5f56"/>
    <circle cx="50" cy="28" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="28" r="6" fill="#27c93f"/>
    <!-- prompt + result line -->
    <text x="28" y="68" font-family="Consolas, 'Courier New', monospace" font-size="20" fill="#8b949e">$ standup-stretch check</text>
    <text x="28" y="100" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#ffffff" xml:space="preserve"><tspan fill="#8b949e">🧘 </tspan><tspan fill="#e3b341">"Stretch!"</tspan><tspan fill="#c9d1d9"> &#8212; you've been at it for 91 minutes</tspan><tspan fill="#484f58"> (0.1s)</tspan></text>
  </g>

  <!-- large pull quote -->
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="38" fill="#f0f6fc">"Stand up and touch your toes,</text>
  <text x="600" y="402" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="38" fill="#f0f6fc">or get as close as feels good."</text>
  <text x="600" y="444" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" fill="#6e7681">One of 15 nudges &#8212; a new one every 90 minutes</text>

  <!-- footer: icon + project name -->
  <g transform="translate(600, 540)">
    <g transform="translate(-170, -14)" stroke="#2ea043" stroke-width="3" stroke-linecap="round" fill="none">
      <circle cx="0" cy="-14" r="4" fill="#2ea043" stroke="none"/>
      <line x1="0" y1="-10" x2="0" y2="6"/>
      <line x1="0" y1="-8" x2="-9" y2="-18"/>
      <line x1="0" y1="-8" x2="9" y2="-18"/>
      <line x1="0" y1="6" x2="-6" y2="15"/>
      <line x1="0" y1="6" x2="6" y2="15"/>
    </g>
    <text x="-130" y="-7" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="28" font-weight="700" fill="#ffffff">standup-stretch</text>
    <text x="0" y="30" text-anchor="middle" font-family="Consolas, 'Courier New', monospace"
          font-size="17" fill="#6e7681">github.com/thisismairaj/standup-stretch</text>
  </g>
</svg>
